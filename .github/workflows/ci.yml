# 每次推送到 main 与每个拉取请求，在干净的 Windows 环境里从头检查一遍：
# 界面类型检查与构建、Rust 格式、clippy、全部测试。本地漏提交的文件、只在本机才有的环境差异都会在这里暴露。
# 只做 Windows。读真实磁盘、要管理员权限的测试标了 #[ignore]，这里不跑。
# 第三方 Action 按提交号固定（注释是对应版本），升级时连提交号一起改。

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE.md']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 与本机开发用的版本一致；clippy 的规则随版本变，不跟着 stable 漂
  RUST_TOOLCHAIN: 1.99.1
  NODE_VERSION: 22
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Rust
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component clippy,rustfmt

      - name: 设为默认工具链
        run: rustup default ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # pnpm 版本取 app/ui/package.json 的 packageManager
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/ui/package.json
          cache: true
          cache_dependency_path: app/ui/pnpm-lock.yaml

      - name: 界面依赖
        working-directory: app/ui
        run: pnpm install --frozen-lockfile

      # 含类型检查；宿主编译时要用构建出的 dist
      - name: 界面构建
        working-directory: app/ui
        run: pnpm build

      - name: Rust 格式
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 测试
        run: cargo test --workspace --locked
