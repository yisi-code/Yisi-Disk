[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
# 只开 JPEG、PNG 解码与 PNG 编码，用于引擎生成预览缩略图
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.4"
tauri-build = "2.7.3"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
windows-sys = "0.61.2"
yisi-broker = { path = "crates/broker" }
yisi-carve = { path = "crates/carve" }
yisi-engine = { path = "crates/engine" }
yisi-formats = { path = "crates/formats" }
yisi-io = { path = "crates/io" }
yisi-rpc = { path = "crates/rpc" }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# 解析磁盘数据的 crate 在 release 构建中也检查整数溢出，作为带检查运算之外的兜底
[profile.release.package.yisi-part]
overflow-checks = true

[profile.release.package.yisi-fs]
overflow-checks = true

[profile.release.package.yisi-formats]
overflow-checks = true

[profile.release.package.yisi-carve]
overflow-checks = true

[profile.release.package.yisi-repair]
overflow-checks = true
